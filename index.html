<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shyama - Focus Mode</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #080d18;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }
    h1 { color: #35e0cf; }
    .card {
      background: #121c2d;
      padding: 20px;
      border-radius: 18px;
      margin: 18px 0;
      border: 1px solid #26364c;
    }
    button {
      background: #35e0cf;
      color: #08121b;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      margin: 5px;
    }
    #time { font-size: 36px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>SHYAMA</h1>
  <p>Your dream deserves your focus.</p>

  <div class="card">
    <h2>Study Timer</h2>
    <div id="time">00:00:00</div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
  </div>

  <div class="card">
    <h2>Today's Mission</h2>
    <p>Physics • Chemistry • Mathematics</p>
    <p>One focused session at a time.</p>
  </div>

  <script>
    let seconds = 0;
    let interval = null;

    function showTime() {
      const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
      const s = String(seconds % 60).padStart(2, "0");
      document.getElementById("time").textContent = `${h}:${m}:${s}`;
    }

    function startTimer() {
      if (interval !== null) return;
      interval = setInterval(() => {
        seconds++;
        showTime();
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(interval);
      interval = null;
    }

    function resetTimer() {
      pauseTimer();
      seconds = 0;
      showTime();
    }
  </script>
</body>
</html>
